<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ShipGo Test</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f4f7fb;margin:0;color:#102033}header{background:#1167e8;color:white;padding:28px 18px;border-radius:0 0 24px 24px}main{padding:16px;max-width:600px;margin:auto}.card{background:white;padding:18px;margin:12px 0;border-radius:18px;box-shadow:0 3px 15px #0001}input,select{width:100%;padding:13px;margin:5px 0 12px;border:1px solid #ccd5e0;border-radius:10px;font-size:16px;box-sizing:border-box}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{width:100%;padding:14px;border:0;border-radius:12px;background:#1167e8;color:white;font-weight:700;font-size:16px}.muted{color:#667085}.total{font-size:28px;font-weight:800}</style>
<header><b style="font-size:28px">ShipGo</b><div>Transport. Levage. Ensemble.</div></header><main>
<div class="card"><h2>Créer un transport test</h2>
<label>Départ</label><input id="from" placeholder="Magog, QC">
<label>Destination</label><input id="to" placeholder="Val-d'Or, QC">
<label>Marchandise</label><input id="cargo" placeholder="Sandvik DI650i">
<div class="row"><div><label>Poids (lb)</label><input id="w" type="number" value="32000"></div><div><label>Pièces</label><input id="n" type="number" value="1"></div></div>
<div class="row"><div><label>Longueur (pi)</label><input id="l" type="number" value="12"></div><div><label>Largeur (pi)</label><input id="wi" type="number" value="8"></div></div>
<div class="row"><div><label>Hauteur (pi)</label><input id="h" type="number" value="11"></div><div><label>CG hauteur (pi)</label><input id="cg" type="number" value="5.2"></div></div>
<label>Levage requis?</label><select id="lift"><option>Oui</option><option>Non</option></select>
<button onclick="create()">Créer le transport</button></div>
<div id="out"></div></main>
<script>
function create(){let g=id=>document.getElementById(id).value;let d={from:g('from')||'Magog, QC',to:g('to')||'Val-d’Or, QC',cargo:g('cargo')||'Sandvik DI650i',w:g('w'),l:g('l'),wi:g('wi'),h:g('h'),cg:g('cg'),lift:g('lift')};localStorage.setItem('shipgo',JSON.stringify(d));document.getElementById('out').innerHTML=`<div class="card"><h2>✅ Transport créé</h2><b>${d.cargo}</b><p>📍 ${d.from} → ${d.to}</p><p>⚖️ ${d.w} lb<br>📐 ${d.l} × ${d.wi} × ${d.h} pi<br>🎯 CG : ${d.cg} pi du sol</p><h3>🏗️ Levage</h3><p>Compagnies de démonstration à proximité :</p><p><b>Grues Estrie</b> — 12 km<br><b>Levage Québec</b> — 28 km<br><b>Grues Nord</b> — 34 km</p><h3>💰 Offre transporteur</h3><label>Transport ($)</label><input id="tp" type="number" value="2800" oninput="calc()"><label>Levage ($)</label><input id="lp" type="number" value="1650" oninput="calc()"><label>Coordination ($)</label><input id="cp" type="number" value="150" oninput="calc()"><p>Total : <span class="total" id="tot">$4,600</span></p><button onclick="alert('Offre test envoyée!')">Envoyer l'offre</button></div>`}
function calc(){let x=['tp','lp','cp'].reduce((a,i)=>a+(+document.getElementById(i).value||0),0);document.getElementById('tot').textContent='$'+x.toLocaleString('fr-CA')}
</script></html>
